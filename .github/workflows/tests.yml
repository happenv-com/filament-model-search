name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        stability: [prefer-stable]

    name: P${{ matrix.php }} - ${{ matrix.stability }}

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --shm-size=256m

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache/files
          key: composer-${{ matrix.php }}-${{ matrix.stability }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ matrix.php }}-${{ matrix.stability }}-
            composer-${{ matrix.php }}-

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pgsql, pdo_pgsql, bcmath, intl, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: List installed dependencies
        run: composer show -D

      - name: Execute tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: postgres
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: vendor/bin/pest --ci

      # The browser tests run on one matrix leg only: they depend on the browser, not on the PHP version.
      - name: Setup Node
        if: matrix.php == '8.5'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install the browsers for the palette tests
        if: matrix.php == '8.5'
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium webkit

      - name: Execute browser tests (Chromium)
        if: matrix.php == '8.5'
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: postgres
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: vendor/bin/pest --ci --testsuite=Browser

      - name: Execute browser tests (WebKit)
        if: matrix.php == '8.5'
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: postgres
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: vendor/bin/pest --ci --testsuite=Browser --browser safari

      - name: Upload the browser test screenshots
        if: failure() && matrix.php == '8.5'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-screenshots
          path: tests/Browser/Screenshots
          if-no-files-found: ignore
